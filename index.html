<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MAKET - Le marketplace d'occasion de confiance au Cameroun. Achetez et vendez en toute sécurité à Yaoundé et Douala." />
    <title>MAKET Livreur</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- Installation en PWA (icône + splash sur l'écran d'accueil, ouverture en
         plein écran sans barre d'adresse) — manifest.json pour Android/Chrome,
         les balises apple-mobile-web-app-* ci-dessous pour iOS/Safari qui ne lit
         pas le manifest pour ces comportements. -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#ffc505" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MAKET Livreur" />
    <!-- Syne uniquement pour le logo -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
